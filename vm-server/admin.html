<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website-Upload</title>
<style>
  :root { --accent: #009acd; --line: #e2e7ee; --muted: #5b6b80; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 'Segoe UI', system-ui, sans-serif; background: #f3f5f8; color: #0f172a; }
  main { max-width: 640px; margin: 3rem auto; padding: 0 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p { color: var(--muted); margin: 0 0 1.25rem; }
  .drop { display: grid; place-items: center; gap: .5rem; min-height: 220px; padding: 2rem; text-align: center; border: 2px dashed #b9c6d6; border-radius: 14px; background: #fff; cursor: pointer; transition: border-color .2s, background .2s; }
  .drop.over { border-color: var(--accent); background: #eef8fc; }
  .drop strong { font-size: 1.05rem; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 1.25rem; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #status { margin-top: .75rem; font-size: .92rem; min-height: 1.5em; }
  .ok { color: #15803d; } .err { color: #b91c1c; }
  a { color: #007ea8; }
</style>
</head>
<body>
<main>
  <h1>Neue Website-Version hochladen</h1>
  <p>Den Ordner <code>dist</code> (nach <code>npm run build</code>) hier hineinziehen oder anklicken und auswählen. Die alte Version wird erst ersetzt, wenn alles vollständig hochgeladen ist – und dann gelöscht.</p>
  <label class="drop" id="drop">
    <strong>Ordner hierher ziehen</strong>
    <span>oder klicken zum Auswählen</span>
    <input type="file" id="pick" webkitdirectory multiple hidden>
  </label>
  <div class="bar"><span id="bar"></span></div>
  <div id="status"></div>
</main>
<script>
const drop = document.getElementById('drop'), pick = document.getElementById('pick');
const bar = document.getElementById('bar'), status = document.getElementById('status');
const say = (t, cls = '') => { status.textContent = t; status.className = cls; };

// Walk a dropped folder (DataTransfer entries) into [{ path, file }].
async function walk(entry, prefix = '') {
  if (entry.isFile) return [{ path: prefix + entry.name, file: await new Promise((r, j) => entry.file(r, j)) }];
  const reader = entry.createReader(), out = [];
  for (;;) {
    const batch = await new Promise((r, j) => reader.readEntries(r, j));
    if (!batch.length) break;
    for (const e of batch) out.push(...await walk(e, prefix + entry.name + '/'));
  }
  return out;
}

// If everything sits in one top folder (e.g. "dist/…") and index.html is not at the root, drop that folder name.
function normalize(items) {
  items = items.filter(i => !/(^|\/)(\.DS_Store|Thumbs\.db)$/.test(i.path));
  while (!items.some(i => i.path === 'index.html')) {
    const tops = new Set(items.map(i => i.path.split('/')[0]));
    if (tops.size !== 1 || items.some(i => !i.path.includes('/'))) break;
    items = items.map(i => ({ ...i, path: i.path.slice(i.path.indexOf('/') + 1) }));
  }
  return items;
}

async function upload(items) {
  items = normalize(items);
  if (!items.some(i => i.path === 'index.html')) return say('Keine index.html gefunden – bitte den Ordner „dist“ hochladen.', 'err');
  try {
    say(`Starte Upload (${items.length} Dateien) …`);
    let r = await fetch('/admin/begin', { method: 'POST' });
    if (!r.ok) throw new Error('Start fehlgeschlagen');
    let done = 0, next = 0;
    const worker = async () => {
      while (next < items.length) {
        const it = items[next++];
        const res = await fetch('/admin/file?path=' + encodeURIComponent(it.path), { method: 'PUT', body: it.file });
        if (!res.ok) throw new Error(`${it.path}: ${(await res.json().catch(() => ({}))).error || res.status}`);
        done++; bar.style.width = (done / items.length * 100) + '%';
        say(`${done} / ${items.length} Dateien hochgeladen …`);
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    r = await fetch('/admin/commit', { method: 'POST' });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Veröffentlichen fehlgeschlagen');
    say('Fertig – neue Version ist live. Alte Version wurde gelöscht.', 'ok');
    status.insertAdjacentHTML('beforeend', ' <a href="/" target="_blank">Website öffnen</a>');
  } catch (e) {
    say('Fehler: ' + e.message + ' – die bisherige Version bleibt unverändert online.', 'err');
  }
}

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', async e => {
  e.preventDefault(); drop.classList.remove('over'); bar.style.width = 0;
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry()).filter(Boolean);
  const items = (await Promise.all(entries.map(en => walk(en)))).flat();
  upload(items);
});
pick.addEventListener('change', () => {
  bar.style.width = 0;
  upload([...pick.files].map(f => ({ path: f.webkitRelativePath || f.name, file: f })));
  pick.value = '';
});
</script>
</body>
</html>
